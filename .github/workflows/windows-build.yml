name: Windows build

on:
  push:
    branches: [claude/hb-clips-cross-platform-jt48h7]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # No pinned flutter-version: `flutter doctor -v` on the previous run
      # showed this runner has Visual Studio 2026 (18.x) installed, but the
      # pinned 3.35.5 (Sept 2025) predates VS2026's release - its CMake
      # generator lookup table has no entry for major version 18, so it
      # silently fell back to the oldest known default ("Visual Studio 16
      # 2019"), which CMake then can't find on this machine. Tracking
      # `stable` instead pulls whatever Flutter release is current today,
      # which should include VS2026 support by now.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Non-blocking: lib/data/local/database.dart has one pre-existing,
      # unrelated analyze error (argument_type_not_assignable) that isn't
      # in scope here - surfaced for visibility without failing the build.
      - run: flutter analyze
        continue-on-error: true

      - run: flutter test

      # Diagnostic only: the previous run failed with CMake unable to find
      # any Visual Studio instance for a "Visual Studio 16 2019" generator,
      # even though windows-latest ships VS2022 - this surfaces exactly what
      # flutter_tools' own VS detection sees on this runner before the next
      # attempt, instead of guessing at a fix blind.
      - run: flutter doctor -v

      # --no-tree-shake-icons: without it, release builds subset the
      # Material Icons font down to only statically-provable codepoints,
      # silently dropping some toolbar icons to empty glyphs - same flag
      # build_portable.bat already carries for the same reason.
      - run: flutter build windows --release --no-tree-shake-icons

      - name: Package portable build
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath HB_Clips-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: HB_Clips-windows
          path: HB_Clips-windows.zip
